name: Pipeline

on:
  push:
    branches: [develop, main]
    tags: ['v[0-9]*']
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.22.3'

      - name: Validate embedded dashboard
        run: |
          npm ci --prefix web
          npm test --prefix web
          npm run build --prefix web
          test -z "$(git status --porcelain -- internal/web/dashboard)"

      - name: Verify release tag version alignment
        if: github.ref_type == 'tag'
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - "$RELEASE_TAG" <<'PY'
          import pathlib, re, sys
          expected = sys.argv[1].lstrip("v")
          chart_text = pathlib.Path("charts/kubereel/Chart.yaml").read_text(encoding="utf-8")
          values_text = pathlib.Path("charts/kubereel/values.yaml").read_text(encoding="utf-8")
          for label, pattern, text in (
              ("Chart.yaml version", r'^version:\s*"?([^"\s]+)"?$', chart_text),
              ("Chart.yaml appVersion", r'^appVersion:\s*"?([^"\s]+)"?$', chart_text),
              ("values.yaml image.tag", r'^\s+tag:\s*"?([^"\s]+)"?$', values_text),
          ):
              match = re.search(pattern, text, re.MULTILINE)
              if not match or match.group(1) != expected:
                  raise SystemExit(f"{label} does not match release tag {expected!r}")
          print(f"Release tag {expected} matches Chart.yaml and values.yaml")
          PY

      - name: Check Go formatting and vet
        run: |
          go fmt ./... && git diff --exit-code
          go vet ./...

      - name: Build Go executable
        run: |
          go build ./...
          rm -f kubereel

      - name: Build Docker image
        env:
          COMMIT_SHA: ${{ github.sha }}
          BUILD_VERSION: ${{ github.ref_type == 'tag' && github.ref_name || 'dev' }}
        run: |
          docker build --build-arg "KUBEREEL_VERSION=${BUILD_VERSION}" --build-arg "KUBEREEL_REVISION=${COMMIT_SHA}" -t "kubereel:${COMMIT_SHA}" .
          docker save "kubereel:${COMMIT_SHA}" -o "${RUNNER_TEMP}/kubereel-image.tar"

      - name: Upload Docker image artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubereel-image
          path: ${{ runner.temp }}/kubereel-image.tar
          retention-days: 1
          if-no-files-found: error

  test:
    needs: [build]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.10'

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        with:
          version: v3.17.3

      - uses: azure/setup-kubectl@776406bce94f63e41d621b960d78ee25c8b76ede # v4.0.1
        with:
          version: v1.32.2

      - name: Install test dependencies
        run: |
          python -m pip install PyYAML==6.0.2
          go install sigs.k8s.io/kind@v0.27.0

      - name: Download Docker image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubereel-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load -i "${RUNNER_TEMP}/kubereel-image.tar"

      - name: Run Go unit and race tests
        run: go test -race ./...

      - name: Validate Helm chart
        run: |
          helm lint ./charts/kubereel
          helm template kubereel ./charts/kubereel > /dev/null
          python charts/kubereel/tests/test_chart.py

      - name: Run Docker smoke and Kind end-to-end tests
        env:
          COMMIT_SHA: ${{ github.sha }}
        run: ./tests/e2e-kind.sh "kubereel:${COMMIT_SHA}"

  push:
    if: github.event_name == 'push'
    needs: [test]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0
        if: github.ref_type == 'tag'

      - uses: azure/setup-helm@b9e51907a09c216f16ebe8536097933489208112 # v4.3.0
        if: github.ref_type == 'tag'
        with:
          version: v3.17.3

      - name: Download tested Docker image artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubereel-image
          path: ${{ runner.temp }}

      - name: Load Docker image
        run: docker load -i "${RUNNER_TEMP}/kubereel-image.tar"

      - name: Log in to Docker Hub
        uses: docker/login-action@74a5d142397b4f367a81961eba4e8cd7edddf772 # v3.4.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Tag and push image to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_REPOSITORY: ${{ vars.DOCKERHUB_REPOSITORY }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          COMMIT_SHA: ${{ github.sha }}
        run: |
          set -eu

          if [ -z "$DOCKERHUB_USERNAME" ]; then
            echo "DOCKERHUB_USERNAME secret is required" >&2
            exit 1
          fi

          repo="${DOCKERHUB_REPOSITORY:-${DOCKERHUB_USERNAME}/kubereel}"
          repo=$(printf '%s' "$repo" | tr '[:upper:]' '[:lower:]')
          short_sha=$(printf '%.7s' "$COMMIT_SHA")
          source_image="kubereel:${COMMIT_SHA}"

          sha_tag="${repo}:sha-${short_sha}"
          docker tag "$source_image" "$sha_tag"
          docker push "$sha_tag"

          if [ "$REF_TYPE" = "tag" ]; then
            docker tag "$source_image" "${repo}:${REF_NAME}"
            docker push "${repo}:${REF_NAME}"

            clean_version="${REF_NAME#v}"
            if [ "$clean_version" != "$REF_NAME" ]; then
              docker tag "$source_image" "${repo}:${clean_version}"
              docker push "${repo}:${clean_version}"
            fi
          else
            safe_branch=$(printf '%s' "$REF_NAME" | tr -c 'a-zA-Z0-9._-' '-' | sed 's/^-*//;s/-*$//')
            docker tag "$source_image" "${repo}:${safe_branch}"
            docker push "${repo}:${safe_branch}"
          fi

      - name: Package and push Helm chart (OCI) on release tags
        if: github.ref_type == 'tag'
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          set -eu
          mkdir -p "${RUNNER_TEMP}/release"
          helm package ./charts/kubereel --destination "${RUNNER_TEMP}/release"
          (cd "${RUNNER_TEMP}/release" && sha256sum kubereel-chart-*.tgz > SHA256SUMS)
          owner=$(printf '%s' "$DOCKERHUB_USERNAME" | tr '[:upper:]' '[:lower:]')
          printf '%s' "$DOCKERHUB_TOKEN" | helm registry login registry-1.docker.io --username "$DOCKERHUB_USERNAME" --password-stdin
          helm push "${RUNNER_TEMP}/release"/kubereel-chart-*.tgz "oci://registry-1.docker.io/${owner}"

      - name: Upload release chart artifacts
        if: github.ref_type == 'tag'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: kubereel-release-assets
          path: ${{ runner.temp }}/release/*
          retention-days: 1
          if-no-files-found: error

  release:
    if: github.event_name == 'push' && github.ref_type == 'tag'
    needs: [push]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Download release chart artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: kubereel-release-assets
          path: ${{ runner.temp }}/release

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -eu
          gh release create "$RELEASE_TAG" \
            "${RUNNER_TEMP}/release"/* \
            --title "KubeReel ${RELEASE_TAG}" \
            --notes-file CHANGELOG.md \
            --verify-tag
