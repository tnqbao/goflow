openapi: 3.0.3
info:
  title: KubeReel Workflow Schedule API
  version: "1"
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
    csrf: []
paths:
  /workflows/{id}/schedule:
    parameters:
      - name: id
        in: path
        required: true
        schema: {type: string}
    get:
      summary: Read the workflow schedule and its latest submitted run
      security: [{bearer: []}, {session: []}]
      responses:
        "200": {$ref: "#/components/responses/Schedule"}
        "404": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
    put:
      summary: Create or replace the workflow schedule
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/ScheduleOptions"}
            example:
              cron: "0 2 * * *"
              inputs:
                prompt: {stringValue: Sunrise over a lake}
      responses:
        "200": {$ref: "#/components/responses/Schedule"}
        "409": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Remove the schedule and preserve submitted runs
      responses:
        "204": {description: Schedule removed}
        "404": {$ref: "#/components/responses/Error"}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    session: {type: apiKey, in: cookie, name: kubereel_session}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
  schemas:
    ScheduleOptions:
      type: object
      required: [cron]
      properties:
        cron:
          type: string
          maxLength: 128
          description: Five cron fields with minute precision in UTC.
        paused: {type: boolean, default: false}
        inputs:
          type: object
          additionalProperties:
            $ref: "../charts/kubereel/crds/kubereel.io_videoruns.yaml#/spec/versions/0/schema/openAPIV3Schema/properties/spec/properties/inputs/additionalProperties"
        maxConcurrentSteps: {type: integer, minimum: 1, maximum: 100}
        allowPaid:
          type: boolean
          default: false
          description: Enables scheduled runs that reference a provider other than the built-in Mock.
    Schedule:
      allOf:
        - {$ref: "#/components/schemas/ScheduleOptions"}
        - type: object
          required: [workflowId, updatedAt]
          properties:
            workflowId: {type: string}
            updatedAt: {type: string, format: date-time}
            lastRunAt: {type: string, format: date-time}
            lastRunId: {type: string}
  responses:
    Schedule:
      description: Current schedule and latest submission
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Schedule"}
    Error:
      description: Authentication, validation, concurrency, or persistence error
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: {type: string}
              message: {type: string}
