openapi: 3.0.3
info:
  title: KubeReel Provider Management API
  version: "1"
servers:
  - url: /api/v1
security:
  - bearer: []
  - session: []
    csrf: []
paths:
  /providers:
    get:
      summary: List namespace provider configurations
      security:
        - bearer: []
        - session: []
      parameters:
        - name: limit
          in: query
          schema: {type: integer, minimum: 1, maximum: 100, default: 50}
        - name: continue
          in: query
          schema: {type: string, maxLength: 4096}
      responses:
        "200":
          description: Provider page
          content:
            application/json:
              schema:
                type: object
                required: [items]
                properties:
                  items:
                    type: array
                    items: {$ref: "#/components/schemas/Provider"}
                  continue: {type: string}
        default: {$ref: "#/components/responses/Error"}
    post:
      summary: Create a provider and store its optional credential
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - {$ref: "#/components/schemas/Changes"}
                - type: object
                  required: [id, type, capabilities]
                  properties:
                    id: {type: string, maxLength: 63}
                    type: {type: string, enum: [mock, gemini, fal]}
      responses:
        "201": {$ref: "#/components/responses/Provider"}
        default: {$ref: "#/components/responses/Error"}
  /providers/{id}:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    get:
      summary: Read one provider
      security:
        - bearer: []
        - session: []
      responses:
        "200": {$ref: "#/components/responses/Provider"}
        default: {$ref: "#/components/responses/Error"}
    patch:
      summary: Update provider settings or rotate its API key
      requestBody:
        required: true
        content:
          application/json:
            schema: {$ref: "#/components/schemas/Changes"}
      responses:
        "200": {$ref: "#/components/responses/Provider"}
        default: {$ref: "#/components/responses/Error"}
    delete:
      summary: Delete provider configuration and release its owned Secrets for garbage collection
      responses:
        "204": {description: Deleted}
        default: {$ref: "#/components/responses/Error"}
  /providers/{id}/test:
    parameters:
      - {$ref: "#/components/parameters/ID"}
    post:
      summary: Check local configuration or upstream metadata access without generation
      responses:
        "200":
          description: Check succeeded
          content:
            application/json:
              schema:
                type: object
                required: [check, status]
                properties:
                  check: {type: string, enum: [local_configuration, model_catalog, model_pricing]}
                  status: {type: string, enum: [ok]}
        default: {$ref: "#/components/responses/Error"}
components:
  securitySchemes:
    bearer: {type: http, scheme: bearer}
    session: {type: apiKey, in: cookie, name: kubereel_session}
    csrf: {type: apiKey, in: header, name: X-CSRF-Token}
  parameters:
    ID:
      name: id
      in: path
      required: true
      schema: {type: string}
  schemas:
    Changes:
      type: object
      properties:
        capabilities:
          type: array
          minItems: 1
          uniqueItems: true
          items: {type: string, enum: [text, image, video]}
        models:
          type: array
          maxItems: 100
          uniqueItems: true
          items: {type: string, maxLength: 253}
        baseURL: {type: string, description: Official provider endpoint. An empty value restores the default.}
        maxConcurrent: {type: integer, minimum: 0, maximum: 100}
        timeoutSeconds: {type: integer, minimum: 0, maximum: 86400}
        enabled: {type: boolean, default: true}
        apiKey: {type: string, writeOnly: true, maxLength: 4096, description: Required when creating a Gemini or fal provider.}
    Provider:
      allOf:
        - {$ref: "#/components/schemas/Changes"}
        - type: object
          required: [id, type, capabilities, enabled, credentialsReferenced]
          properties:
            id: {type: string}
            type: {type: string, enum: [mock, gemini, fal]}
            credentialsReferenced: {type: boolean}
  responses:
    Provider:
      description: Provider configuration
      content:
        application/json:
          schema: {$ref: "#/components/schemas/Provider"}
    Error:
      description: Request, authorization, or upstream error
      content:
        application/json:
          schema:
            type: object
            required: [error, message]
            properties:
              error: {type: string}
              message: {type: string}
