apiVersion: v1
kind: Service
metadata:
  name: {{ include "goflow.fullname" . }}
  labels:
    {{- include "goflow.labels" . | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "goflow.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
