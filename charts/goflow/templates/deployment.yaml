apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "goflow.fullname" . }}
  labels:
    {{- include "goflow.labels" . | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "goflow.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "goflow.selectorLabels" . | nindent 8 }}
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: goflow
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
            - name: shm
              mountPath: /dev/shm
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "goflow.fullname" . }}
        - name: shm
          emptyDir:
            medium: Memory
            sizeLimit: {{ .Values.sharedMemory.size | quote }}
