apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: videoworkflows.kubereel.io
spec:
  group: kubereel.io
  scope: Namespaced
  names:
    plural: videoworkflows
    singular: videoworkflow
    kind: VideoWorkflow
    shortNames: [vwf]
  versions:
    - name: v1alpha1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          required: [spec]
          properties:
            apiVersion:
              type: string
            kind:
              type: string
            metadata:
              type: object
            spec:
              type: object
              required: [steps]
              properties:
                description:
                  type: string
                  maxLength: 4096
                inputs:
                  type: array
                  maxItems: 100
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                      type:
                        type: string
                        enum: [string, integer, number, boolean]
                      required:
                        type: boolean
                      description:
                        type: string
                        maxLength: 1024
                steps:
                  type: array
                  minItems: 1
                  maxItems: 100
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, type]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                      type:
                        type: string
                        enum: [input, llm, image, video, ffmpeg, output]
                      dependsOn:
                        type: array
                        maxItems: 100
                        x-kubernetes-list-type: set
                        items:
                          type: string
                          minLength: 1
                          maxLength: 63
                      providerRef:
                        type: string
                        minLength: 1
                        maxLength: 253
                      retry:
                        type: object
                        properties:
                          maxAttempts:
                            type: integer
                            minimum: 1
                            maximum: 100
                      timeoutSeconds:
                        type: integer
                        minimum: 1
                        maximum: 86400
                      resources:
                        type: object
                        properties:
                          requests:
                            type: object
                            properties:
                              cpu: {type: string, minLength: 1, maxLength: 32}
                              memory: {type: string, minLength: 1, maxLength: 32}
                          limits:
                            type: object
                            properties:
                              cpu: {type: string, minLength: 1, maxLength: 32}
                              memory: {type: string, minLength: 1, maxLength: 32}
                outputs:
                  type: array
                  maxItems: 100
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [name]
                  items:
                    type: object
                    required: [name, from]
                    properties:
                      name:
                        type: string
                        minLength: 1
                        maxLength: 63
                      from:
                        type: string
                        minLength: 1
                        maxLength: 63
