image:
  repository: kubereel
  tag: latest
  pullPolicy: IfNotPresent

service:
  port: 8080

persistence:
  size: 1Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
  accessMode: ReadWriteOnce
  existingClaim: ""

resources: {}

workflow:
  maxConcurrent: 4

ingress:
  enabled: false
  className: ""
  annotations: {}
  host: ""
  tls: []
