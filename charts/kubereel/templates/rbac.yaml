apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- if include "kubereel.createWorkerServiceAccount" . }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubereel.workerServiceAccountName" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
    app.kubernetes.io/component: worker
  {{- with .Values.workerServiceAccount.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoruns", "videoproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoproviders"]
    verbs: ["create", "update", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoworkflows"]
    verbs: ["get", "list", "create", "update", "delete"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoruns"]
    verbs: ["create", "update"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoruns/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubereel.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubereel.fullname" . }}
