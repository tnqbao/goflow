apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
rules:
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["get", "list", "watch", "create", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoruns", "videoproviders"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["kubereel.io"]
    resources: ["videoruns/status"]
    verbs: ["update"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
subjects:
  - kind: ServiceAccount
    name: {{ include "kubereel.fullname" . }}
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "kubereel.fullname" . }}
