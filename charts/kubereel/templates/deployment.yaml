apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubereel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubereel.selectorLabels" . | nindent 8 }}
        kubereel.io/control-plane: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ include "kubereel.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: kubereel
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args: ["serve"]
          env:
            - name: ARTIFACT_MAX_BYTES
              value: {{ printf "%d" (.Values.storage.maxArtifactBytes | int64) | quote }}
            - name: ARTIFACT_RETENTION_SECONDS
              value: {{ printf "%d" (.Values.storage.retentionSeconds | int64) | quote }}
            - name: EXECUTION_MODE
              value: {{ .Values.execution.mode | quote }}
            - name: NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: JOB_IMAGE
              value: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) | quote }}
            - name: IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: PVC_NAME
              value: {{ include "kubereel.claimName" . | quote }}
            - name: INSTANCE_NAME
              value: {{ .Release.Name | quote }}
            - name: SHARED_STORAGE
              value: {{ eq .Values.storage.accessMode "ReadWriteMany" | quote }}
            - name: MAX_CONCURRENT_JOBS
              value: {{ .Values.execution.maxConcurrentJobs | quote }}
            - name: JOB_TTL_SECONDS
              value: {{ .Values.execution.jobTTLSeconds | quote }}
            {{- $workerSA := include "kubereel.workerServiceAccountName" . }}
            {{- if $workerSA }}
            - name: WORKER_SERVICE_ACCOUNT
              value: {{ $workerSA | quote }}
            {{- end }}
            {{- if eq .Values.storage.type "s3" }}
            - name: STORAGE_TYPE
              value: "s3"
            - name: S3_BUCKET
              value: {{ .Values.storage.s3.bucket | quote }}
            - name: S3_REGION
              value: {{ .Values.storage.s3.region | quote }}
            {{- if .Values.storage.s3.prefix }}
            - name: S3_PREFIX
              value: {{ .Values.storage.s3.prefix | quote }}
            {{- end }}
            {{- if .Values.storage.s3.endpoint }}
            - name: S3_ENDPOINT
              value: {{ .Values.storage.s3.endpoint | quote }}
            {{- end }}
            {{- if .Values.storage.s3.forcePathStyle }}
            - name: S3_FORCE_PATH_STYLE
              value: "true"
            {{- end }}
            {{- if .Values.storage.s3.existingSecret }}
            - name: S3_CREDENTIALS_SECRET
              value: {{ .Values.storage.s3.existingSecret | quote }}
            - name: S3_ACCESS_KEY_ID_KEY
              value: {{ .Values.storage.s3.accessKeyIdKey | quote }}
            - name: S3_SECRET_ACCESS_KEY_KEY
              value: {{ .Values.storage.s3.secretAccessKeyKey | quote }}
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret | quote }}
                  key: {{ .Values.storage.s3.accessKeyIdKey | quote }}
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.storage.s3.existingSecret | quote }}
                  key: {{ .Values.storage.s3.secretAccessKeyKey | quote }}
            {{- end }}
            {{- end }}
            - name: AUTH_SESSION_TTL_SECONDS
              value: {{ printf "%d" (.Values.auth.sessionTTLSeconds | int64) | quote }}
            {{- if .Values.auth.existingSecret }}
            - name: AUTH_BOOTSTRAP_USERNAME
              value: {{ .Values.auth.username | quote }}
            {{- if .Values.auth.passwordKey }}
            - name: AUTH_BOOTSTRAP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.passwordKey | quote }}
            {{- end }}
            {{- if .Values.auth.setupTokenKey }}
            - name: AUTH_SETUP_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | quote }}
                  key: {{ .Values.auth.setupTokenKey | quote }}
            {{- end }}
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubereel.claimName" . }}
