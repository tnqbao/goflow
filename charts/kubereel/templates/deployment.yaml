apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "kubereel.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kubereel.selectorLabels" . | nindent 8 }}
        kubereel.io/control-plane: {{ .Release.Name | quote }}
    spec:
      serviceAccountName: {{ include "kubereel.fullname" . }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: kubereel
          image: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
            seccompProfile:
              type: RuntimeDefault
          args: ["serve"]
          env:
            - name: KUBEREEL_ARTIFACT_MAX_BYTES
              value: {{ printf "%d" (.Values.storage.maxArtifactBytes | int64) | quote }}
            - name: KUBEREEL_ARTIFACT_RETENTION_SECONDS
              value: {{ printf "%d" (.Values.storage.retentionSeconds | int64) | quote }}
            - name: KUBEREEL_EXECUTION_MODE
              value: {{ .Values.execution.mode | quote }}
            - name: KUBEREEL_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: KUBEREEL_JOB_IMAGE
              value: {{ printf "%s:%s" .Values.image.repository (.Values.image.tag | toString) | quote }}
            - name: KUBEREEL_IMAGE_PULL_POLICY
              value: {{ .Values.image.pullPolicy | quote }}
            - name: KUBEREEL_PVC
              value: {{ include "kubereel.claimName" . | quote }}
            - name: KUBEREEL_INSTANCE
              value: {{ .Release.Name | quote }}
            - name: KUBEREEL_SHARED_STORAGE
              value: {{ eq .Values.storage.accessMode "ReadWriteMany" | quote }}
            - name: KUBEREEL_MAX_CONCURRENT
              value: {{ .Values.execution.maxConcurrentJobs | quote }}
            - name: KUBEREEL_JOB_TTL_SECONDS
              value: {{ .Values.execution.jobTTLSeconds | quote }}
          ports:
            - name: http
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "kubereel.claimName" . }}
