{{- if not .Values.storage.existingClaim }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "kubereel.fullname" . }}
  labels:
    {{- include "kubereel.labels" . | nindent 4 }}
spec:
  accessModes:
    - {{ .Values.storage.accessMode | quote }}
  {{- with .Values.storage.storageClass }}
  storageClassName: {{ . | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.storage.size | quote }}
{{- end }}
